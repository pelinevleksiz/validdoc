server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx'in varsayilan mime.types dosyasinda .mjs uzantisi tanimli degil
    # (sadece .js var). Server context'inde bir "types {}" blogu tanimlamak
    # nginx'te mevcut mime.types eslemesini BIRLESTIRMEZ, tamamen degistirir
    # - bu yuzden onceki haliyle css/svg/woff/... gibi diger tum statik
    # dosyalar yanlis Content-Type (application/octet-stream) ile donuyordu.
    # Sadece .mjs icin dogru tipi zorlayip diger her seyi varsayilan
    # mime.types eslemesine birakiyoruz.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}